services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    expose:
      - "8000"
    volumes:
      - material_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/material-ai/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  material_data:
  caddy_data:
  caddy_config:
