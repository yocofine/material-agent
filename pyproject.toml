[project]
name = "material-agent"
version = "0.1.0"
description = "教辅「资料归集与核对」AI Agent：接收→解析分类→命名上传→二次核对→异常处理"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "httpx>=0.27.0",
    "fastmcp>=2.0.0",
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "PyMySQL>=1.1.1",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "rarfile>=4.1",
]

[project.scripts]
material-agent = "material_agent.cli:main"
material-agent-api = "material_agent.api_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
